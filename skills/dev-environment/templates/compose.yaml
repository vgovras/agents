services:
  db:
    image: docker.io/library/postgres:18.6-trixie
    environment:
      POSTGRES_USER: <app>
      POSTGRES_PASSWORD: <app>
      POSTGRES_DB: <app>
    ports: ['127.0.0.1:5432:5432']
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U <app> -d <app>']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: { context: ., target: dev }
    user: '${CONTAINER_USER:-1000:1000}'
    command: ['sh', '-c', 'pnpm install --frozen-lockfile && pnpm dev']
    environment:
      DATABASE_URL: postgres://<app>:<app>@db:5432/<app>
      HOME: /tmp
      DB_SCHEMA: public
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - .:/app
      - pnpm-store:/pnpm-store
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
  pnpm-store:
